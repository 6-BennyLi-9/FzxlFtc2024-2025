name: Android Build

on:
  pull_request:
    branches: [ "teamcode" ]
  workflow_dispatch:

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'oracle'
        cache: gradle
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Clean Cached
      run: ./gradlew clean
    - name: Build with Gradle
      run: ./gradlew build
    - name: Assemble Debug
      run: gradle TeamCode:assembleDebug
